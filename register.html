<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก - MG UBON</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #fafafa;
        }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white px-8 py-12 rounded-2xl shadow-sm border border-gray-200 w-full max-w-md text-center transition-all duration-300">
        
        <h1 class="text-2xl font-bold text-gray-800 mb-2">กรอกข้อมูลสมัครสมาชิก</h1>
        <p class="text-xs font-semibold text-gray-400 tracking-wider uppercase mb-8">MG UBONRATCHATHANI</p>

        <form id="registerForm" class="text-left space-y-5" novalidate>
            
            <div>
                <label for="fullName" class="block text-sm font-medium text-gray-700 mb-1.5">ชื่อ-นามสกุล:</label>
                <input type="text" id="fullName" name="fullName" required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500 transition-all text-sm placeholder-gray-400"
                    placeholder="เช่น นาย เออเบิร์น สุดล้ำ">
                <p id="nameError" class="text-xs text-red-500 mt-1 hidden">กรุณากรอกชื่อ-นามสกุลให้ครบถ้วนค่ะ</p>
            </div>

            <div>
                <label for="phoneNumber" class="block text-sm font-medium text-gray-700 mb-1.5">เบอร์โทรศัพท์:</label>
                <input type="tel" id="phoneNumber" name="phoneNumber" required pattern="^[0-9]{9,10}$"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500 transition-all text-sm placeholder-gray-400"
                    placeholder="เช่น 0991234567">
                <p id="phoneError" class="text-xs text-red-500 mt-1 hidden">กรุณากรอกเบอร์โทรศัพท์ให้ถูกต้อง (9-10 หลัก) ค่ะ</p>
            </div>

            <button type="submit" id="submitBtn"
                class="w-full bg-[#e31c23] hover:bg-[#c11319] text-white font-medium py-3 px-4 rounded-lg transition-all duration-200 shadow-sm cursor-pointer text-center flex items-center justify-center space-x-2">
                <span id="btnText">ส่งข้อมูลสมัครสมาชิก</span>
            </button>
        </form>

        <div class="mt-8">
            <a href="index2.html" class="text-sm text-gray-500 hover:text-red-600 inline-flex items-center space-x-1 transition-all duration-200 font-medium">
                <span>←</span> <span>กลับสู่หน้าหลักแอป</span>
            </a>
        </div>
    </div>

    <script>
        // ใส่ลิงก์ Google Apps Script ของคุณชินอิจิไว้ที่ตัวแปรหลักตัวเดียวเพื่อความเป็นระเบียบ
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbygjKxNwVXok7IHwVD2RbS9wXnmfvcVYn7GwNRP4im2N9GjpZgbp8xbSZSIwlwp3pYCtw/exec";

        const form = document.getElementById('registerForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const fullNameInput = document.getElementById('fullName');
        const phoneNumberInput = document.getElementById('phoneNumber');
        
        const nameError = document.getElementById('nameError');
        const phoneError = document.getElementById('phoneError');

        form.addEventListener('submit', function(event) {
            event.preventDefault(); // ป้องกันการ Refresh หน้าจอตามมาตรฐาน Single Page Application

            // ล้างสถานะแจ้งเตือนข้อผิดพลาดเก่าก่อนตรวจเช็กใหม่
            nameError.classList.add('hidden');
            phoneError.classList.add('hidden');
            
            let isValid = true;

            // ระบบ Input Validation ตรวจสอบความถูกต้องของข้อมูลก่อนส่งขึ้นฐานข้อมูล
            if (!fullNameInput.value.trim()) {
                nameError.classList.remove('hidden');
                isValid = false;
            }

            const phonePattern = /^[0-9]{9,10}$/;
            if (!phonePattern.test(phoneNumberInput.value.trim())) {
                phoneError.classList.remove('hidden');
                isValid = false;
            }

            if (!isValid) return; // หยุดการทำงานทันทีหากข้อมูลในฟอร์มไม่ถูกต้อง

            // ปรับปรุงด้าน UX: ล็อกปุ่มกดป้องกันผู้ใช้งานกดย้ำซ้ำๆ ระหว่างที่ระบบกำลังประมวลผล
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-70', 'cursor-not-allowed');
            btnText.innerText = "กำลังบันทึกข้อมูลระบบ...";

            // จัดการชุดโครงสร้างข้อมูลเตรียมส่งออก
            const payload = {
                name: fullNameInput.value.trim(),
                phone: phoneNumberInput.value.trim()
            };

            // 🛠️ จุดแก้ไขหลัก: แก้ไขไวยากรณ์คำสั่ง fetch ให้ทำงานได้อย่างถูกต้องสมบูรณ์
            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors", // ใช้โหมด no-cors เพื่อส่งข้อมูลข้ามโดเมนไปยัง Google สคริปต์ได้โดยไม่ติดบล็อก
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                // แสดงการแจ้งเตือนความสำเร็จให้กับลูกค้าหน้าร้าน
                alert('🎉 บันทึกข้อมูลการสมัครสมาชิกเรียบร้อยแล้วค่ะ ขอบพระคุณค่ะ');
                form.reset(); // เคลียร์ค่าในกล่องอินพุตให้ว่างเพื่อรองรับลูกค้ารายต่อไป
            })
            .catch(error => {
                console.error('Database connection error:', error);
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อฐานข้อมูล กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ตและลองใหม่อีกครั้งค่ะ');
            })
            .finally(() => {
                // คืนค่าสถานะของปุ่มส่งข้อมูลให้พร้อมกลับมาทำงานได้ตามปกติ
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
                btnText.innerText = "ส่งข้อมูลสมัครสมาชิก";
            });
        });
    </script>
</body>
</html>
