<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA State Persistence App</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        /* Smooth transitions for tab switching */
        .page-content {
            transition: opacity 0.2s ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <header class="bg-indigo-600 text-white shadow-md px-4 py-3 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">PWA Smart App</h1>
            <span id="pwa-status" class="text-xs bg-indigo-500 px-2 py-1 rounded-full text-indigo-100">Web Mode</span>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6 mb-16">
        
        <section id="page-dashboard" class="page-content hidden bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <h2 class="text-2xl font-bold text-slate-900 mb-2">📊 หน้าแดชบอร์ด</h2>
            <p class="text-slate-500 mb-6">ระบบจำค่าหน้านี้ไว้ แม้คุณจะกด Refresh เว็บไซต์ก็ตาม</p>
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-indigo-50 p-4 rounded-xl">
                    <span class="block text-xs text-indigo-500 font-medium uppercase">ผู้เข้าชมวันนี้</span>
                    <span class="text-2xl font-bold text-indigo-900">1,240</span>
                </div>
                <div class="bg-emerald-50 p-4 rounded-xl">
                    <span class="block text-xs text-emerald-500 font-medium uppercase">สถานะระบบ</span>
                    <span class="text-2xl font-bold text-emerald-900">Online</span>
                </div>
            </div>
        </section>

        <section id="page-profile" class="page-content hidden bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <h2 class="text-2xl font-bold text-slate-900 mb-2">👤 ข้อมูลผู้ใช้งาน</h2>
            <p class="text-slate-500 mb-4">ลองพิมพ์ชื่อของคุณ ระบบจะบันทึกไว้ในฐานข้อมูล LocalStorage ทันที</p>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">ชื่อ-นามสกุล</label>
                    <input type="text" id="username-input" class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="พิมพ์ชื่อของคุณที่นี่...">
                </div>
            </div>
        </section>

        <section id="page-settings" class="page-content hidden bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <h2 class="text-2xl font-bold text-slate-900 mb-2">⚙️ ตั้งค่าระบบ</h2>
            <p class="text-slate-500 mb-4">ปรับแต่งการทำงานของแอปพลิเคชัน</p>
            <div class="flex items-center justify-between p-3 bg-slate-50 rounded-lg">
                <span class="font-medium text-slate-700">เปิดการแจ้งเตือน (Mock)</span>
                <input type="checkbox" id="noti-toggle" class="w-5 h-5 accent-indigo-600">
            </div>
        </section>

    </main>

    <nav class="bg-white border-t border-slate-200 fixed bottom-0 left-0 right-0 z-50 shadow-lg">
        <div class="max-w-4xl mx-auto flex justify-around">
            <button data-target="dashboard" class="nav-btn flex flex-col items-center justify-center py-3 w-full text-slate-400 hover:text-indigo-600 transition-colors">
                <span class="text-xl">📊</span>
                <span class="text-xs mt-1 font-medium">แดชบอร์ด</span>
            </button>
            <button data-target="profile" class="nav-btn flex flex-col items-center justify-center py-3 w-full text-slate-400 hover:text-indigo-600 transition-colors">
                <span class="text-xl">👤</span>
                <span class="text-xs mt-1 font-medium">โปรไฟล์</span>
            </button>
            <button data-target="settings" class="nav-btn flex flex-col items-center justify-center py-3 w-full text-slate-400 hover:text-indigo-600 transition-colors">
                <span class="text-xl">⚙️</span>
                <span class="text-xs mt-1 font-medium">ตั้งค่า</span>
            </button>
        </div>
    </nav>

    <script>
        // 1. STATE MANAGEMENT (ความจำแอป)
        const appState = {
            currentPage: localStorage.getItem('last_page') || 'dashboard', // ดึงหน้าล่าสุด ถ้าไม่มีให้ไป dashboard
            username: localStorage.getItem('username') || '',
            notiEnabled: localStorage.getItem('noti_enabled') === 'true'
        };

        // 2. ROUTING LOGIC (ฟังก์ชันเปลี่ยนหน้า)
        function switchPage(pageId) {
            // ซ่อนทุกหน้า
            document.querySelectorAll('.page-content').forEach(page => page.classList.add('hidden'));
            // แสดงหน้าที่จะเปิด
            const targetPage = document.getElementById(`page-${pageId}`);
            if (targetPage) targetPage.classList.remove('hidden');

            // อัปเดตสีของปุ่ม Navigation
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if (btn.getAttribute('data-target') === pageId) {
                    btn.classList.add('text-indigo-600');
                    btn.classList.remove('text-slate-400');
                } else {
                    btn.classList.remove('text-indigo-600');
                    btn.classList.add('text-slate-400');
                }
            });

            // บันทึกลงฐานข้อมูลด่วน เพื่อจำค่าตอน Refresh
            appState.currentPage = pageId;
            localStorage.setItem('last_page', pageId);
        }

        // 3. INITIALIZATION & EVENT LISTENERS
        document.addEventListener('DOMContentLoaded', () => {
            // เปิดหน้าล่าสุดที่ค้างไว้ทันทีเมื่อโหลดเสร็จ
            switchPage(appState.currentPage);

            // ใส่ Event ให้ปุ่มกดเมนูด้านล่าง ทุกปุ่ม
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const targetPage = e.currentTarget.getAttribute('data-target');
                    switchPage(targetPage);
                });
            });

            // ผูกข้อมูล input หน้า Profile กับ LocalStorage
            const nameInput = document.getElementById('username-input');
            nameInput.value = appState.username;
            nameInput.addEventListener('input', (e) => {
                localStorage.setItem('username', e.target.value);
            });

            // ผูกข้อมูล checkbox หน้า Settings กับ LocalStorage
            const notiToggle = document.getElementById('noti-toggle');
            notiToggle.checked = appState.notiEnabled;
            notiToggle.addEventListener('change', (e) => {
                localStorage.setItem('noti_enabled', e.target.checked);
            });
        });

        // 4. REGISTER SERVICE WORKER (ระบบสำหรับติดตั้งลงมือถือ)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => {
                        console.log('Service Worker ลงทะเบียนสำเร็จ!', reg.scope);
                        document.getElementById('pwa-status').innerText = "PWA Ready";
                    })
                    .catch(err => console.log('Service Worker ลงทะเบียนล้มเหลว:', err));
            });
        }
    </script>
</body>
</html>
