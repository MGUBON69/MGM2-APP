<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MG UBON - Loading...</title>
    <!-- เรียกใช้งาน Tailwind CSS v4 Engine สำหรับโครงสร้างการโหลดระดับพรีเมียม -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-gray-900 flex flex-col items-center justify-center min-h-screen p-4 text-white">

    <!-- แอนิเมชันเกตเวย์ระหว่างระบบประมวลผลการจัดเส้นทาง (Routing Process) -->
    <div class="text-center space-y-6 max-w-sm w-full">
        <!-- ตัวโหลดสัญลักษณ์วงกลมแบบสตรีมมิ่งหรูหรา -->
        <div class="relative w-16 h-16 mx-auto">
            <div class="absolute inset-0 rounded-full border-4 border-gray-700"></div>
            <div class="absolute inset-0 rounded-full border-4 border-t-red-500 border-r-transparent border-b-transparent border-l-transparent animate-spin"></div>
        </div>
        
        <div class="space-y-2">
            <h1 class="text-lg font-bold tracking-wider text-gray-100">กำลังเข้าสู่ระบบแอปพลิเคชัน</h1>
            <p class="text-xs text-red-500 font-semibold tracking-widest uppercase">MG UBONRATCHATHANI</p>
        </div>
    </div>

    <!-- สคริปต์สถาปัตยกรรมจัดการย้ายเส้นทางข้อมูลในระบบ (Single Page Application Router Gateway) -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // ระบบจะหน่วงเวลา UX 500 มิลลิวินาทีเพื่อให้สคริปต์โหลดเสร็จสมบูรณ์ ก่อนส่งตัวผู้ใช้ไปยังแอปหลัก index3.html
            setTimeout(function() {
                window.location.href = "index3.html";
            }, 500);
        });
    </script>
</body>
</html>
