<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MG UBONRATCHATHANI - Register Application</title>
    
    <!-- ฝังรหัสการประกาศตัวเป็นโมบายแอปพลิเคชัน PWA สากล -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#dc2626">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- เรียกใช้งาน Tailwind CSS v4 Engine สำหรับโครงสร้างแอปพลิเคชันระดับพรีเมียม -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center justify-start p-0 antialiased relative">

    <!-- ส่วนหัวแอปพลิเคชัน (Hero Banner Section) -->
    <div class="relative w-full max-w-md bg-gray-900 shadow-2xl border-b border-gray-800">
        <div class="h-56 w-full overflow-hidden relative">
            <img src="car (8).png" alt="MG Cyberster" class="w-full h-full object-cover object-center brightness-90">
            <div class="absolute inset-0 bg-gradient-to-t from-gray-900 via-gray-900/40 to-transparent"></div>
        </div>
        
        <div class="px-6 pb-6 -mt-12 relative z-10 flex items-end space-x-4">
            <img src="MG_profile.png" alt="MG Logo" class="w-20 h-20 rounded-2xl border-4 border-gray-900 bg-white shadow-xl p-1">
            <div class="mb-1">
                <h1 class="text-xl font-bold tracking-tight text-white">MG UBONRATCHATHANI</h1>
                <p class="text-xs text-red-500 font-semibold tracking-wider uppercase">M2 MOTORSPORT OPERATED</p>
            </div>
        </div>
    </div>

    <!-- ส่วนเนื้อหาฟอร์มลงทะเบียนสมัครสมาชิก (Application Form Context) -->
    <main class="w-full max-w-md px-6 py-4 flex-1">
        <div class="bg-gray-900 rounded-3xl p-6 border border-gray-800 shadow-xl space-y-6">
            <div class="space-y-1">
                <h2 class="text-lg font-semibold text-gray-200">ลงทะเบียนรับสิทธิพิเศษ</h2>
                <p class="text-xs text-gray-400">กรุณากรอกข้อมูลให้ครบถ้วนเพื่อรับสิทธิ์และข้อเสนอแคมเปญล่าสุด</p>
            </div>

            <!-- ฟอร์มลงทะเบียนรับข้อมูล (Form Controls) -->
            <form id="registerForm" class="space-y-4" onsubmit="handleSubmit(event)">
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-gray-400">ชื่อ - นามสกุล</label>
                    <input type="text" required id="fullName" placeholder="คุณสมชาย ใจดี" 
                        class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-red-600 focus:ring-1 focus:ring-red-600 transition-all duration-200">
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-gray-400">เบอร์โทรศัพท์ติดต่อ</label>
                    <input type="tel" required id="phoneNumber" pattern="[0-9]{9,10}" placeholder="0812345678" 
                        class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-red-600 focus:ring-1 focus:ring-red-600 transition-all duration-200">
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-gray-400">รถยนต์รุ่นที่ท่านสนใจ</label>
                    <select id="carModel" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-red-600 focus:ring-1 focus:ring-red-600 transition-all duration-200">
                        <option value="MG Cyberster">MG Cyberster (รถสปอร์ตไฟฟ้า)</option>
                        <option value="MG4 Electric">MG4 Electric</option>
                        <option value="MG S5">MG S5</option>
                        <option value="MG5">MG5 Series</option>
                    </select>
                </div>

                <button type="submit" 
                    class="w-full bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white font-semibold py-3.5 px-4 rounded-xl text-sm transition-all duration-300 transform active:scale-[0.98] shadow-lg shadow-red-900/30">
                    ส่งข้อมูลลงทะเบียน
                </button>
            </form>
        </div>
    </main>

    <!-- กล่องแจ้งเตือนจำลองพรีเมียม (Custom Premium Modal) ปราศจากหัวข้อเบราว์เซอร์กวนใจ -->
    <div id="customModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm hidden transition-all duration-300">
        <div class="bg-gray-900 border border-gray-800 w-full max-w-sm rounded-3xl p-6 text-center shadow-2xl scale-95 transition-transform duration-300 space-y-5">
            <div class="mx-auto flex items-center justify-center h-14 w-14 rounded-full bg-green-950 border border-green-500/30 text-green-400">
                <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
            </div>
            
            <div class="space-y-2">
                <h3 class="text-lg font-bold text-white tracking-wide" id="modalTitle">MG UBONRATCHATHANI</h3>
                <p class="text-sm text-gray-300 leading-relaxed" id="modalMessage">บันทึกข้อมูลสำเร็จ</p>
            </div>
            
            <button onclick="closeModal()" 
                class="w-full bg-gray-800 hover:bg-gray-700 border border-gray-700 text-white font-medium py-3 px-4 rounded-xl text-sm transition-all duration-200">
                ตกลง
            </button>
        </div>
    </div>

    <footer class="w-full max-w-md text-center py-6 text-[10px] text-gray-600 tracking-wider">
        SECURE PWA APPLICATION © 2026 MG UBONRATCHATHANI
    </footer>

    <!-- สคริปต์สถาปัตยกรรมภายในแอปพลิเคชัน (JavaScript Controller) -->
    <script>
        // 1. ลงทะเบียนการทำงานระบบ Service Worker เพื่อเปิดสิทธิ์การเป็นแอปมือถือ
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js');
            });
        }

        // 2. ฟังก์ชันเปิด/ปิดกล่องแจ้งเตือน Custom Modal
        function openModal(title, message) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerHTML = message;
            const modal = document.getElementById('customModal');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.querySelector('div').classList.remove('scale-95'); modal.querySelector('div').classList.add('scale-100'); }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('customModal');
            modal.querySelector('div').classList.remove('scale-100'); modal.querySelector('div').classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 200);
        }

        // 3. ฟังก์ชันประมวลผลข้อมูลลงทะเบียนเมื่อกดปุ่ม
        function handleSubmit(event) {
            event.preventDefault();
            const fullName = document.getElementById('fullName').value;
            const phoneNumber = document.getElementById('phoneNumber').value;
            const carModel = document.getElementById('carModel').value;

            if(fullName.trim() === "" || phoneNumber.trim() === "") {
                openModal("แจ้งเตือนระบบ", "กรุณากรอกข้อมูลให้ครบถ้วนค๊า");
                return;
            }

            const successDetail = `🎉 บันทึกข้อมูลการสมัครสมาชิกเรียบร้อยแล้วค่ะ ขอบพระคุณค่ะ<br><br><span class="text-xs text-gray-400">ชื่อ: ${fullName}<br>รุ่นรถที่สนใจ: ${carModel}</span>`;
            openModal("MG UBONRATCHATHANI", successDetail);
            document.getElementById('registerForm').reset();
        }
    </script>
</body>
</html>
