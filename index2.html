<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MG UBONRATCHATHANI - Register Application</title>
    
    <!-- ลงทะเบียนรหัสการเป็นแอปพลิเคชันสมาร์ทโฟน PWA สากล -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#dc2626">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- เรียกใช้งาน Tailwind CSS v4 Engine ประมวลผลดีไซน์แบบ Real-time -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        
        /* สถาปัตยกรรม CSS คุมโทนสี Dark Premium ป้องกันหน้าจอสีเบี้ยว */
        :root {
            --bg-main: #0b0f19;
            --bg-card: #111827;
            --text-main: #f3f4f6;
            --mg-red: #dc2626;
        }
        body { 
            font-family: 'Sarabun', sans-serif; 
            background-color: var(--bg-main) !important;
            color: var(--text-main) !important;
        }
        .premium-card {
            background-color: var(--bg-card) !important;
            border: 1px solid #1f2937 !important;
        }
        .custom-input {
            background-color: #030712 !important;
            border: 1px solid #27272a !important;
            color: #ffffff !important;
        }
        .custom-input:focus {
            border-color: var(--mg-red) !important;
            box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.2) !important;
        }
        /* แถบพื้นหลังเรืองแสงนีออนสไตล์สปอร์ตพรีเมียม */
        .neon-banner {
            background: linear-gradient(180deg, #111827 0%, #070a13 100%);
            position: relative;
            overflow: hidden;
        }
        .neon-banner::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--mg-red), transparent);
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center justify-start p-0 antialiased relative">

    <!-- ส่วนหัวแอปพลิเคชัน (จัดระเบียบใหม่ ลบรูปที่พังด้านบนออกถาวร) -->
    <header class="relative w-full max-w-md premium-card shadow-2xl neon-banner px-6 py-8 text-center flex flex-col items-center justify-center space-y-3">
        <!-- โลโก้ศูนย์กลาง พรีเมียมคมชัด -->
        <div class="relative">
            <img src="MG_profile.png" alt="MG Logo" class="w-20 h-20 rounded-2xl border-2 border-gray-800 bg-white shadow-xl p-1 mx-auto">
            <span class="absolute -bottom-1 -right-1 flex h-3 w-3">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
            </span>
        </div>
        
        <!-- ข้อความชื่อแบรนด์และบริษัทจัดเรียงเป็นระบบ -->
        <div class="space-y-1">
            <h1 class="text-xl font-bold tracking-tight text-white">MG UBONRATCHATHANI</h1>
            <p class="text-xs text-red-500 font-semibold tracking-wider uppercase">M2 MOTORSPORT OPERATED</p>
        </div>
    </header>

    <!-- ส่วนเนื้อหาฟอร์มลงทะเบียนสมัครสมาชิก (จัดสัดส่วนใหม่ให้เป็นระบบระเบียบ) -->
    <main class="w-full max-w-md px-6 py-6 flex-1">
        <div class="premium-card rounded-3xl p-6 shadow-2xl space-y-6">
            <div class="space-y-1.5 border-b border-gray-800/60 pb-4">
                <h2 class="text-lg font-semibold text-gray-100 flex items-center">
                    <svg class="w-5 h-5 text-red-500 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    ลงทะเบียนรับสิทธิพิเศษ
                </h2>
                <p class="text-xs text-gray-400 leading-relaxed">กรุณากรอกข้อมูลให้ครบถ้วนเพื่อรับสิทธิ์และข้อเสนอแคมเปญล่าสุด</p>
            </div>

            <!-- ฟอร์มลงทะเบียนรับข้อมูลพร้อมระบบกรอกที่ลื่นไหล (Responsive Inputs) -->
            <form id="registerForm" class="space-y-5" onsubmit="handleSubmit(event)">
                <!-- ช่องกรอกชื่อ -->
                <div class="space-y-2">
                    <label class="text-xs font-medium text-gray-300 flex items-center">
                        ชื่อ - นามสกุล <span class="text-red-500 ml-1">*</span>
                    </label>
                    <input type="text" required id="fullName" placeholder="คุณ เออเบิ้ล วิ่งไกล
                        class="w-full custom-input rounded-xl px-4 py-3.5 text-sm placeholder-gray-600 focus:outline-none transition-all duration-200">
                </div>

                <!-- ช่องกรอกเบอร์โทร -->
                <div class="space-y-2">
                    <label class="text-xs font-medium text-gray-300 flex items-center">
                        เบอร์โทรศัพท์ติดต่อ <span class="text-red-500 ml-1">*</span>
                    </label>
                    <input type="tel" required id="phoneNumber" pattern="[0-9]{9,10}" placeholder="0812345678" 
                        class="w-full custom-input rounded-xl px-4 py-3.5 text-sm placeholder-gray-600 focus:outline-none transition-all duration-200">
                </div>

                <!-- ปุ่มกดส่งข้อมูล ดีไซน์ให้ใหญ่และเด่นชัดตามหลัก UX -->
                <div class="pt-2">
                    <button type="submit" 
                        class="w-full bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white font-semibold py-4 px-4 rounded-xl text-sm transition-all duration-300 transform active:scale-[0.99] shadow-lg shadow-red-900/40 cursor-pointer">
                        ส่งข้อมูลลงทะเบียน
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- กล่องแจ้งเตือนจำลองพรีเมียมสไตล์แอปมือถือ (Custom Premium Modal) -->
    <div id="customModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm hidden transition-all duration-300">
        <div class="bg-gray-900 border border-gray-800 w-full max-w-sm rounded-3xl p-6 text-center shadow-2xl scale-95 transition-transform duration-300 space-y-5">
            <div class="mx-auto flex items-center justify-center h-14 w-14 rounded-full bg-green-950 border border-green-500/30 text-green-400">
                <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
            </div>
            
            <div class="space-y-2">
                <h3 class="text-lg font-bold text-white tracking-wide" id="modalTitle">MG UBONRATCHATHANI</h3>
                <p class="text-sm text-gray-300 leading-relaxed" id="modalMessage">บันทึกข้อมูลสำเร็จ</p>
            </div>
            
            <button onclick="closeModal()" 
                class="w-full bg-gray-800 hover:bg-gray-700 border border-gray-700 text-white font-medium py-3 px-4 rounded-xl text-sm transition-all duration-200 cursor-pointer">
                ตกลง
            </button>
        </div>
    </div>

    <!-- ส่วนท้ายแอปพลิเคชัน -->
    <footer class="w-full max-w-md text-center py-6 text-[10px] text-gray-600 tracking-wider mt-auto">
        SECURE PWA APPLICATION © 2026 MG UBONRATCHATHANI
    </footer>

    <!-- สคริปต์สถาปัตยกรรมภายในควบคุมแอปพลิเคชัน (JavaScript Controller) -->
    <script>
        // เปิดระบบเปิดสิทธิ์การรันแอปพลิเคชันบนสมาร์ทโฟนผ่าน Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js');
            });
        }

        // ฟังก์ชันควบคุมการทำงานของกล่องแจ้งเตือน Custom Modal
        function openModal(title, message) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerHTML = message;
            const modal = document.getElementById('customModal');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.querySelector('div').classList.remove('scale-95'); modal.querySelector('div').classList.add('scale-100'); }, 10);
        }

        document.addEventListener('keydown', function(e) {
            if(e.key === 'Escape') closeModal();
        });

        function closeModal() {
            const modal = document.getElementById('customModal');
            modal.querySelector('div').classList.remove('scale-100'); modal.querySelector('div').classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 200);
        }

        // ฟังก์ชันดักจับข้อมูลและส่งข้อมูลสำเร็จ
        function handleSubmit(event) {
            event.preventDefault();
            const fullName = document.getElementById('fullName').value;
            const phoneNumber = document.getElementById('phoneNumber').value;

            if(fullName.trim() === "" || phoneNumber.trim() === "") {
                openModal("แจ้งเตือนระบบ", "กรุณากรอกข้อมูลให้ครบถ้วนค๊า");
                return;
            }

            const successDetail = `🎉 บันทึกข้อมูลการสมัครสมาชิกเรียบร้อยแล้วค่ะ ขอบพระคุณค่ะ<br><br><span class="text-xs text-gray-400">ชื่อ: ${fullName}<br>เบอร์โทร: ${phoneNumber}</span>`;
            openModal("MG UBONRATCHATHANI", successDetail);
            document.getElementById('registerForm').reset();
        }
    </script>
</body>
</html>
