<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MG UBONRATCHATHANI - Register Application</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#dc2626">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        
        /* สถาปัตยกรรม CSS คุมโทนสี Dark Premium ล็อคหน้าจอและช่องกรอกไม่ให้สีเบี้ยว */
        :root {
            --bg-main: #0b0f19;
            --bg-card: #111827;
            --text-main: #f3f4f6;
            --mg-red: #dc2626;
        }
        body { 
            font-family: 'Sarabun', sans-serif; 
            background-color: var(--bg-main) !important;
            color: var(--text-main) !important;
        }
        .premium-card {
            background-color: var(--bg-card) !important;
            border: 1px solid #1f2937 !important;
        }
        
        /* ล็อคโครงสร้างชุดคำสั่งช่องกรอกข้อมูลให้เท่ากันทุกช่องเพื่อความพรีเมียม */
        .custom-input {
            background-color: #030712 !important;
            border: 1px solid #27272a !important;
            color: #ffffff !important;
            border-radius: 0.75rem !important;
            width: 100% !important;
            padding-top: 0.875rem !important;
            padding-bottom: 0.875rem !important;
            padding-left: 1rem !important;
            padding-right: 1rem !important;
            font-size: 0.875rem !important;
            outline: none !important;
            transition: all 0.2s ease-in-out !important;
        }
        .custom-input:focus {
            border-color: var(--mg-red) !important;
            box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.2) !important;
        }
        .custom-input::placeholder {
            color: #4b5563 !important;
        }
        
        /* แถบพื้นหลังเรืองแสงนีออนสไตล์สปอร์ตพรีเมียมหน้าแรก */
        .neon-banner {
            background: linear-gradient(180deg, #111827 0%, #070a13 100%);
            position: relative;
            overflow: hidden;
        }
        .neon-banner::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--mg-red), transparent);
        }

        /* ตารางสไตล์ดั้งเดิมที่เสถียรที่สุดเพื่อจัดเรียงกล่องข้อมูลลูกค้ามุมขวาบนให้สมบูรณ์แบบ */
        .badge-table {
            display: table !important;
            width: auto !important;
            border-collapse: separate !important;
        }
        .badge-cell {
            display: table-cell !important;
            vertical-align: middle !important;
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center justify-start p-0 antialiased relative">

    <div id="registerView" class="w-full flex flex-col items-center justify-start">
        <header class="relative w-full max-w-md premium-card shadow-2xl neon-banner px-6 py-8 text-center flex flex-col items-center justify-center space-y-3">
            <div class="relative">
                <img src="MG_profile.png" alt="MG Logo" class="w-20 h-20 rounded-2xl border-2 border-gray-800 bg-white shadow-xl p-1 mx-auto">
                <span class="absolute -bottom-1 -right-1 flex h-3 w-3">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
                </span>
            </div>
            
            <div class="space-y-1">
                <h1 class="text-xl font-bold tracking-tight text-white">MG UBONRATCHATHANI</h1>
                <p class="text-xs text-red-500 font-semibold tracking-wider uppercase">M2 MOTORSPORT OPERATED</p>
            </div>
        </header>

        <main class="w-full max-w-md px-6 py-6">
            <div class="premium-card rounded-3xl p-6 shadow-2xl space-y-6">
                <div class="space-y-1.5 border-b border-gray-800/60 pb-4">
                    <h2 class="text-lg font-semibold text-gray-100 flex items-center">
                        <svg class="w-5 h-5 text-red-500 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        ลงทะเบียนรับสิทธิพิเศษ
                    </h2>
                    <p class="text-xs text-gray-400 leading-relaxed">กรุณากรอกข้อมูลให้ครบถ้วนเพื่อรับสิทธิ์และข้อเสนอแคมเปญล่าสุด</p>
                </div>

                <form id="registerForm" class="space-y-5" onsubmit="handleSubmit(event)">
                    <div class="space-y-2">
                        <label class="text-xs font-medium text-gray-300 flex items-center">
                            ชื่อ - นามสกุล <span class="text-red-500 ml-1">*</span>
                        </label>
                        <input type="text" required id="fullName" placeholder="คุณสมชาย ใจดี" class="custom-input">
                    </div>

                    <div class="space-y-2">
                        <label class="text-xs font-medium text-gray-300 flex items-center">
                            เบอร์โทรศัพท์ติดต่อ <span class="text-red-500 ml-1">*</span>
                        </label>
                        <input type="tel" required id="phoneNumber" pattern="[0-9]{9,10}" placeholder="0812345678" class="custom-input">
                    </div>

                    <div class="pt-2">
                        <button type="submit" class="w-full bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white font-semibold py-4 px-4 rounded-xl text-sm transition-all duration-300 transform active:scale-[0.99] shadow-lg shadow-red-900/40 cursor-pointer">
                            ส่งข้อมูลลงทะเบียน
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>


    <div id="dashboardView" class="w-full flex flex-col items-center justify-start hidden animate-[fadeIn_0.3s_ease-out]">
        
        <header class="w-full max-w-md px-4 py-4 flex items-center justify-between border-b border-gray-800/60 bg-gray-900/40 backdrop-blur-md sticky top-0 z-40">
            <div class="flex items-center space-x-2">
                <img src="MG_profile.png" alt="MG Logo" class="w-8 h-8 rounded-xl border border-gray-800 bg-white p-0.5 block">
                <span class="text-xs font-bold text-white tracking-wider block">MG M2</span>
            </div>
            
            <div class="bg-gray-950/90 border border-gray-800 rounded-2xl p-2 pr-4 shadow-xl max-w-[240px] badge-table">
                <div class="badge-cell">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-red-600 to-red-800 text-white text-xs font-bold shadow-md shadow-red-900/30 flex items-center justify-center text-center mr-3 shrink-0" id="userAvatar" style="line-height: 1 !important;">
                        น
                    </div>
                </div>
                <div class="badge-cell text-left overflow-hidden">
                    <div class="text-xs font-bold text-gray-100 truncate tracking-wide mb-0.5" id="badgeName" style="max-width: 160px;">นาย เลิศฤทธิ์ สังขะมณี</div>
                    <div class="text-[10px] text-gray-400 font-medium tracking-wider" id="badgePhone">0996193126</div>
                </div>
            </div>
        </header>

        <main class="w-full max-w-md px-6 py-24 flex flex-col items-center justify-center text-center">
            
            </main>
    </div>

    <footer class="w-full max-w-md text-center py-6 text-[10px] text-gray-600 tracking-wider mt-auto z-10">
        SECURE PWA APPLICATION © 2026 MG UBONRATCHATHANI
    </footer>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js');
            });
        }

        // ฟังก์ชันรับข้อมูลฟอร์มและจัดการสถานะเปลี่ยนหน้าแบบ SPA
        function handleSubmit(event) {
            event.preventDefault();
            const fullName = document.getElementById('fullName').value.trim();
            const phoneNumber = document.getElementById('phoneNumber').value.trim();

            if(fullName === "" || phoneNumber === "") {
                alert("กรุณากรอกข้อมูลให้ครบถ้วนค๊า");
                return;
            }

            // 1. จัดเก็บข้อมูลลงฐานข้อมูลเบราว์เซอร์ชั่วคราว
            localStorage.setItem('mg_user_name', fullName);
            localStorage.setItem('mg_user_phone', phoneNumber);

            // 2. จัดส่งข้อมูลไปยังกล่องโปรไฟล์ชุดปรับปรุงพรีเมียมมุมขวาบน
            document.getElementById('badgeName').innerText = fullName;
            document.getElementById('badgePhone').innerText = phoneNumber;
            
            // ประมวลผลดึงตัวอักษรตัวแรกสุดมาโชว์ในวงกลมให้สวยงามกึ่งกลาง
            if(fullName.length > 0) {
                document.getElementById('userAvatar').innerText = fullName.charAt(0).toUpperCase();
            }

            // 3. สลับสถานะหน้าต่างแอปพลิเคชันไปยังหน้าถัดไปอย่างไร้รอยต่อ
            document.getElementById('registerView').classList.add('hidden');
            document.getElementById('dashboardView').classList.remove('hidden');
            
            // รีเซ็ตล้างฟอร์มกรอกข้อมูลหน้าแรกเพื่อความสะอาดปลอดภัย
            document.getElementById('registerForm').reset();
        }

        // เช็คสถานะกันข้อมูลหลุดหายเมื่อมีการกดรีเฟรชหน้าเบราว์เซอร์
        window.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem('mg_user_name');
            const savedPhone = localStorage.getItem('mg_user_phone');
            
            if(savedName && savedPhone && !document.getElementById('dashboardView').classList.contains('hidden')) {
                document.getElementById('badgeName').innerText = savedName;
                document.getElementById('badgePhone').innerText = savedPhone;
                document.getElementById('userAvatar').innerText = savedName.charAt(0).toUpperCase();
            }
        });
    </script>
</body>
</html>
